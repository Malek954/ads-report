# Cloudflare Pages config for the client report (git-connected project "ads-report").
# Secrets (set with `wrangler pages secret put`, never in this file):
#   META_TOKEN, META_TOKEN_SSD, AUTH_USERS, SESSION_KEY
name = "ads-report"
pages_build_output_dir = "."
compatibility_date = "2026-10-01"

[[kv_namespaces]]
binding = "AUTH_KV"
id = "3e42263f64ee4682917801577bfffcd7"
