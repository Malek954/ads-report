<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Sign In · Impact Systems</title>
<link rel="stylesheet" href="/login.css">
</head>
<body>
<div class="bg" aria-hidden="true">
  <div class="bg-glow g1"></div>
  <div class="bg-glow g2"></div>
  <div class="bg-grid"></div>
  <div class="bg-bar"></div>
</div>
<main id="gate">
  <img src="/brand-logo.png" alt="Impact Systems" class="brand-img">
  <div class="gate-sub">See your performance better</div>
  <form class="gate-box" id="loginForm" autocomplete="on" novalidate>
    <h2>Sign In</h2>
    <p>Enter your username to open your report.</p>
    <input id="un" class="gate-input" name="username" type="text" placeholder="Username"
           maxlength="64" autocomplete="username" autocapitalize="none" spellcheck="false" required>
    <button id="loginBtn" type="submit">View My Report</button>
    <div id="loginError" role="alert"></div>
  </form>
</main>
<script src="/login.js"></script>
</body>
</html>
